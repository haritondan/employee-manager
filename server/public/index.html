<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mega Lorem Ipsum — Team Directory</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <h1>Team Directory</h1>
        <button type="button" id="openAddBtn" class="btn btn-primary">
          + Add Member
        </button>
      </header>

      <div class="toolbar">
        <div class="search-box">
          <label for="searchInput" class="sr-only">Search</label>
          <input
            type="search"
            id="searchInput"
            placeholder="Live search by name, email, department..."
            autocomplete="off"
          />
        </div>
        <div id="activeFilterBadge" class="filter-status"></div>
        <div class="limit-box">
          <label for="limit">Show</label>
          <select id="limit" name="limit" required>
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
        </div>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th data-sort="id" class="sortable">
                ID <span class="sort-icon">↕</span>
              </th>
              <th data-sort="name" class="sortable">
                Name <span class="sort-icon">↕</span>
              </th>
              <th data-sort="email" class="sortable">
                Email <span class="sort-icon">↕</span>
              </th>
              <th data-sort="department" class="sortable">
                Department <span class="sort-icon">↕</span>
              </th>
              <th data-sort="role" class="sortable">
                Role <span class="sort-icon">↕</span>
              </th>
              <th data-sort="status" class="sortable">
                Status <span class="sort-icon">↕</span>
              </th>
              <th class="actions-header">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Dynamic rows populated by app.js -->
          </tbody>
        </table>
        <div id="noResults" class="no-results hidden">
          No matching records found.
        </div>
      </div>

      <div id="pagination" class="pagination-wrapper">
        <button type="button" id="prevPage" class="btn btn-secondary btn-nav">
          &laquo; Prev
        </button>
        <div id="pagesContainer" class="pages-container">
          <!-- Dynamic page buttons dynamically populated by app.js -->
        </div>
        <button type="button" id="nextPage" class="btn btn-secondary btn-nav">
          Next &raquo;
        </button>
      </div>
    </div>

    <dialog id="formDialog" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Add New Member</h2>
          <button
            type="button"
            class="close-btn"
            data-close-modal
            aria-label="Close modal"
          >
            ✕
          </button>
        </div>

        <form id="itemForm" novalidate>
          <input type="hidden" id="itemId" name="id" />

          <div class="form-group">
            <label for="name">Full Name *</label>
            <input
              type="text"
              id="name"
              name="name"
              required
              minlength="2"
              placeholder="e.g. Jane Doe"
            />
            <span class="error-msg" id="nameError"></span>
          </div>

          <div class="form-group">
            <label for="email">Email Address *</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="e.g. jane@example.com"
            />
            <span class="error-msg" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="department">Department *</label>
            <input
              type="text"
              id="department"
              name="department"
              required
              placeholder="e.g. Engineering"
            />
            <span class="error-msg" id="departmentError"></span>
          </div>

          <div class="form-group">
            <label for="role">Role *</label>
            <input
              type="text"
              id="role"
              name="role"
              required
              placeholder="e.g. Frontend Engineer"
            />
            <span class="error-msg" id="roleError"></span>
          </div>

          <div class="form-group">
            <label for="status">Status *</label>
            <select id="status" name="status" required>
              <option value="Select">-- Select Status --</option>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
              <option value="Pending">Pending</option>
            </select>
            <span class="error-msg" id="statusError"></span>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-close-modal>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary" id="saveBtn">
              Save Member
            </button>
          </div>
        </form>
      </div>
    </dialog>

    <dialog id="deleteDialog" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Confirm Deletion</h2>
          <button
            type="button"
            class="close-btn"
            data-close-modal
            aria-label="Close modal"
          >
            ✕
          </button>
        </div>
        <p id="deletePrompt">
          Are you sure you want to delete this record? This action cannot be
          undone.
        </p>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>
            Cancel
          </button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
            Yes, Delete
          </button>
        </div>
      </div>
    </dialog>

    <script src="app.js" type="module"></script>
  </body>
</html>
